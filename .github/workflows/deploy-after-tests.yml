name: Deploy After Tests

on:
  workflow_run:
    workflows: ["Run Tests"]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Test Status
        if: github.event.workflow_run.conclusion != 'success'
        run: |
          echo "::warning::Parent workflow 'Run Tests' failed or was cancelled!"
          echo "Aborting deployment to avoid shipping broken code."
          exit 1

      - name: Execute Production Deployment
        if: github.event.workflow_run.conclusion == 'success'
        run: |
          echo "Parent tests passed successfully!"
          echo "Deploying latest application build to production environment..."