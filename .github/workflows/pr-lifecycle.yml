name: PR Lifecycle

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  pr-details:
    runs-on: ubuntu-latest
    steps:
      - name: Print Event Action
        run: |
          echo "Event Action: ${{ github.event.action }}"

      - name: Print PR Title
        run: |
          echo "PR Title: ${{ github.event.pull_request.title }}"

      - name: Print PR Author
        run: |
          echo "PR Author: ${{ github.event.pull_request.user.login }}"

      - name: Print Source and Target Branch
        run: |
          echo "Source Branch (Head): ${{ github.head_ref }}"
          echo "Target Branch (Base): ${{ github.base_ref }}"

      - name: PR Merged Check
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        run: |
          echo "Success: The PR was officially merged!"
