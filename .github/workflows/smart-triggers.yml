name: Smart Code Triggers

on:
  push:
    branches:
      - main
      - 'release/*'
    paths:
      - 'src/**'
      - 'app/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Code Changed Notification
        run: echo "Changes detected in src/ or app/ folder on main or release branch. Running build..."